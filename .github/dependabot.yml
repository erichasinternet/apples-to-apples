version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Denver
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels: [dependencies, bun]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Denver
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels: [dependencies, github-actions]
    commit-message:
      prefix: "chore(deps)"
