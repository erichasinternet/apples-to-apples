name: Bug Report
description: Report incorrect unit-price extraction, rendering, or sorting behavior.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Retailer URL
      description: Paste the page URL if it is safe to share.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Screenshots, product titles, visible unit prices, or console output.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, extension version, OS, and location/fulfillment context if relevant.
