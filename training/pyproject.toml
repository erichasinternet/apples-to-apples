[project]
name = "apples-to-apples-training"
version = "0.1.0"
description = "Reproducible T5Gemma 2 fine-tuning environment for Apples to Apples."
requires-python = ">=3.11,<3.13"
dependencies = [
  "accelerate>=1.14,<2",
  "datasets>=5,<6",
  "numpy>=2,<3",
  "peft>=0.19,<1",
  "pillow>=12.3,<13",
  "torch>=2.13,<3",
  "transformers>=5.14,<6"
]

[tool.uv]
package = false
