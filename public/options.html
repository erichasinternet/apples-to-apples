<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Apples to Apples Preferences</title>
    <style>
      :root {
        --receipt-paper: #fbfaf6;
        --countertop: #f3f0e8;
        --shelf-ink: #1f241f;
        --muted-ink: #637064;
        --tag-line: #d8d3c8;
        --ledger-green: #236652;
        --warning-amber: #8a5a08;
        --button-fill: #26352f;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        background: var(--receipt-paper);
        color: var(--shelf-ink);
      }

      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 32px 20px 44px;
      }

      header {
        border-bottom: 1px solid var(--tag-line);
        padding-bottom: 18px;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 24px;
        font-weight: 780;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: var(--muted-ink);
        line-height: 1.5;
      }

      form {
        display: grid;
        gap: 16px;
      }

      section {
        border: 1px solid var(--tag-line);
        border-radius: 8px;
        background: #fffdfa;
        padding: 16px;
      }

      h2 {
        margin: 0 0 12px;
        font-size: 14px;
        font-weight: 760;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
      }

      label {
        display: grid;
        gap: 6px;
        color: var(--muted-ink);
        font-size: 12px;
      }

      select {
        min-height: 36px;
        border: 1px solid var(--tag-line);
        border-radius: 6px;
        background: var(--receipt-paper);
        color: var(--shelf-ink);
        padding: 0 10px;
        font: inherit;
      }

      .check {
        grid-template-columns: auto 1fr;
        align-items: center;
      }

      input[type="checkbox"] {
        width: 16px;
        height: 16px;
        accent-color: var(--ledger-green);
      }

      button {
        min-height: 38px;
        border: 1px solid var(--button-fill);
        border-radius: 6px;
        background: var(--button-fill);
        color: #fffaf0;
        font: inherit;
        font-weight: 680;
        padding: 0 16px;
        width: fit-content;
        cursor: pointer;
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--ledger-green);
        outline-offset: 2px;
      }

      #status {
        min-height: 20px;
        color: var(--ledger-green);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Apples to Apples</h1>
        <p>Preferred display units and page controls.</p>
      </header>

      <form id="preferences-form">
        <section>
          <h2>On shopping pages</h2>
          <div class="grid">
            <label class="check">
              <input type="checkbox" name="enabled" />
              Show normalized unit prices
            </label>
            <label class="check">
              <input type="checkbox" name="showLowestSignal" />
              Mark the lowest of at least 3 comparable loaded items
            </label>
          </div>
        </section>

        <section>
          <h2>Display units</h2>
          <div class="grid">
            <label>
              Weight
              <select name="mass">
                <option value="lb">$/lb</option>
                <option value="oz">¢/oz</option>
                <option value="kg">$/kg</option>
                <option value="g">¢/g</option>
              </select>
            </label>
            <label>
              Volume
              <select name="volume">
                <option value="fl_oz">¢/fl oz</option>
                <option value="l">$/L</option>
                <option value="ml">¢/mL</option>
                <option value="gal">$/gal</option>
              </select>
            </label>
            <label>
              Area
              <select name="area">
                <option value="sq_ft">¢/sq ft</option>
                <option value="sq_in">¢/sq in</option>
              </select>
            </label>
            <label>
              Length
              <select name="length">
                <option value="ft">$/ft</option>
                <option value="in">¢/in</option>
              </select>
            </label>
          </div>
        </section>

        <section>
          <h2>Privacy</h2>
          <p>
            Product and price information is processed on this device. Page
            contents are not sent to us or sold to anyone.
            <a href="privacy.html" target="_blank" rel="noreferrer">Privacy policy</a>
          </p>
        </section>

        <button type="submit">Save preferences</button>
        <div id="status" role="status" aria-live="polite"></div>
      </form>
    </main>
    <script src="options.js"></script>
  </body>
</html>
