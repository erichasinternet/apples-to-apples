<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Apples Unit</title>
    <style>
      :root {
        --receipt-paper: #fbfaf6;
        --shelf-ink: #1f241f;
        --muted-ink: #667064;
        --tag-line: #d8d3c8;
        --ledger-green: #236652;
        --coupon-amber: #8a5a08;
        --button-fill: #26352f;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        width: 320px;
        margin: 0;
        color: var(--shelf-ink);
        background: var(--receipt-paper);
      }

      main {
        padding: 14px;
      }

      h1 {
        margin: 0 0 2px;
        font-size: 15px;
        font-weight: 750;
        letter-spacing: 0;
      }

      .subtle {
        margin: 0 0 14px;
        color: var(--muted-ink);
        font-size: 12px;
      }

      .stack {
        display: grid;
        gap: 10px;
      }

      button,
      a.button {
        min-height: 34px;
        border: 1px solid var(--button-fill);
        border-radius: 6px;
        background: var(--button-fill);
        color: #fffaf0;
        font: inherit;
        font-size: 13px;
        font-weight: 650;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      button.secondary,
      a.button.secondary {
        background: transparent;
        color: var(--shelf-ink);
        border-color: var(--tag-line);
      }

      button:focus-visible,
      a.button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--ledger-green);
        outline-offset: 2px;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border-top: 1px solid var(--tag-line);
        padding-top: 10px;
      }

      label {
        font-size: 12px;
        color: var(--muted-ink);
      }

      select {
        min-height: 30px;
        border: 1px solid var(--tag-line);
        border-radius: 6px;
        background: #fffdfa;
        color: var(--shelf-ink);
        padding: 0 8px;
      }

      #status {
        min-height: 18px;
        margin-top: 10px;
        color: var(--ledger-green);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Apples to Apples</h1>
      <p class="subtle">Inline unit prices on shopping pages.</p>

      <div class="stack">
        <button id="run-tab" type="button">Run on this tab</button>
        <a class="button secondary" href="options.html" target="_blank" rel="noreferrer">Preferences</a>
      </div>

      <div id="status" role="status" aria-live="polite"></div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
