<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Apples to Apples</title>
    <style>
      :root {
        --paper: #fbfaf6;
        --ink: #1f241f;
        --muted: #637064;
        --rule: #d8d3c8;
        --green: #236652;
        --button: #26352f;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 336px;
        margin: 0;
        background: var(--paper);
        color: var(--ink);
      }

      main {
        padding: 16px;
      }

      header {
        padding-bottom: 13px;
        border-bottom: 1px solid var(--rule);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 15px;
        font-weight: 760;
        letter-spacing: 0;
      }

      #summary-count {
        margin: 0;
        font-size: 17px;
        font-weight: 720;
        line-height: 1.3;
      }

      #summary-detail {
        min-height: 18px;
        margin: 3px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }

      .controls {
        display: grid;
        gap: 10px;
        padding-top: 13px;
      }

      #basis-field {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: center;
        gap: 10px;
      }

      #basis-field[hidden] {
        display: none;
      }

      label {
        color: var(--muted);
        font-size: 12px;
      }

      select,
      button,
      a {
        min-height: 36px;
        border-radius: 6px;
        font: inherit;
        font-size: 13px;
      }

      select {
        width: 100%;
        min-width: 0;
        border: 1px solid var(--rule);
        background: #fffdfa;
        color: var(--ink);
        padding: 0 30px 0 9px;
      }

      button,
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--button);
        background: var(--button);
        color: #fff;
        cursor: pointer;
        font-weight: 650;
        text-decoration: none;
      }

      button:disabled {
        cursor: default;
        opacity: 0.42;
      }

      .secondary-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .secondary-actions button,
      .secondary-actions a {
        border-color: var(--rule);
        background: transparent;
        color: var(--ink);
        font-weight: 600;
      }

      button:focus-visible,
      a:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--green);
        outline-offset: 2px;
      }

      #status {
        min-height: 17px;
        margin-top: 9px;
        color: var(--green);
        font-size: 12px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Apples to Apples</h1>
        <p id="summary-count">Reading page...</p>
        <p id="summary-detail"></p>
      </header>

      <div class="controls">
        <div id="basis-field" hidden>
          <label for="basis">Compare</label>
          <select id="basis"></select>
        </div>
        <button id="sort-loaded" type="button" disabled>Sort loaded items</button>
        <div class="secondary-actions">
          <button id="rescan" type="button">Rescan</button>
          <a href="options.html" target="_blank" rel="noreferrer">Preferences</a>
        </div>
      </div>

      <div id="status" role="status" aria-live="polite"></div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
